<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Martian+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="roadmap.css">
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <div class="brand"><b>Switchyard</b><span>Claude &amp; Codex sessions across your servers</span></div>
    <div class="hosts" id="hosts"></div>
    <label class="limit" for="limit">Per server
      <select id="limit"><option value="20">20</option><option value="50">50</option><option value="all">all</option></select>
    </label>
    <button type="button" class="btn quiet" id="add-sessions-btn" data-open-add>Add sessions</button>
    <button type="button" class="btn quiet" id="status-changes-btn" data-open-changes>Status changes</button>
    <div class="seg" role="group" aria-label="Layout">
      <button type="button" id="view-lines" data-view="lines" aria-pressed="true">Lines</button>
      <button type="button" id="view-cards" data-view="cards" aria-pressed="false">Cards</button>
    </div>
    <a class="board-link" href="board.html">Board</a>
  </div>
</header>
<main class="wrap">
  <p class="conn" id="conn" role="status">Connecting to the hub…</p>
  <div class="summary" id="summary" role="group" aria-label="Filter sessions by state"></div>
  <div id="yards"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="d-title"></aside>
<div class="toast" id="toast" role="status" hidden></div>
<script src="layout.js"></script>
<script src="roadmap.js"></script>
</body>
</html>
